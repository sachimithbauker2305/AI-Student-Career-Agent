services:
  - type: web
    name: nextstep-career-agent
    runtime: python
    plan: free

    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build

    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6

      - key: ENABLE_API_DOCS
        value: "false"

      - key: AI_PROVIDER
        value: ollama

      - key: OLLAMA_BASE_URL
        value: https://ollama.com

      - key: OLLAMA_MODEL
        value: gpt-oss:20b-cloud

      - key: OLLAMA_API_KEY
        sync: false

      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"

      - key: DATABASE_URL
        fromDatabase:
          name: nextstep-career-db
          property: connectionString

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM
        sync: false

databases:
  - name: nextstep-career-db
    plan: free
