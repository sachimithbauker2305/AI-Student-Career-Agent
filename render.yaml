services:
  - type: web
    name: nextstep-career-agent
    runtime: python
    plan: free

    buildCommand: >
      pip install -r backend/requirements.txt &&
      cd frontend &&
      npm install &&
      npm run build

    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6

      - key: ENABLE_API_DOCS
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: nextstep-career-db
          property: connectionString

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini

      - key: OPENAI_API_URL
        value: https://api.openai.com/v1/responses

      - key: OPENAI_CHAT_TIMEOUT
        value: "45"

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: nextstep-career-db
    plan: free
